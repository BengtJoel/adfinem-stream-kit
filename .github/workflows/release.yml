# Builds the Setup .exe and the zip and attaches them to a GitHub release.
# Runs when a tag like v1.0.1 is pushed, or when a release is published on github.com.
name: Release
on:
  push:
    tags: ["v*"]
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version from tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          [ "${{ github.event_name }}" = "release" ] && TAG="${{ github.event.release.tag_name }}"
          VER="${TAG#v}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"; echo "VER=$VER" >> "$GITHUB_ENV"
          printf '%s\n' "$VER" > kit/_system/version.txt
      - name: Build installer
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q nsis
          mkdir -p release
          makensis -V2 -DVERSION="$VER" setup.nsi
      - name: Build zip
        run: |
          mkdir -p zipsrc && cp -r kit "zipsrc/AD FINEM Stream Kit"
          chmod +x "zipsrc/AD FINEM Stream Kit"/*.sh "zipsrc/AD FINEM Stream Kit"/_system/*.py
          (cd zipsrc && zip -qr "../release/AD-FINEM-Stream-Kit-$VER.zip" "AD FINEM Stream Kit")
          (cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            NOTES="kit/CHANGES/$TAG.md"; [ -f "$NOTES" ] || NOTES=/dev/null
            gh release create "$TAG" release/* --title "AD FINEM Stream Kit $VER" --notes-file "$NOTES"
          fi
