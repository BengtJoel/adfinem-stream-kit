# Builds the Setup .exe and the zip and publishes them as GitHub release v<version>.
# Runs when kit/_system/version.txt changes on main (= a new version), when a release is
# published on github.com, or by hand (Actions > Release > Run workflow).
name: Release
on:
  push:
    branches: [main]
    paths: ["kit/_system/version.txt", ".github/workflows/release.yml"]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version from tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then TAG="${{ github.event.release.tag_name }}"; VER="${TAG#v}"
          else VER="$(head -n1 kit/_system/version.txt | tr -d '[:space:]')"; TAG="v$VER"; fi
          echo "TAG=$TAG" >> "$GITHUB_ENV"; echo "VER=$VER" >> "$GITHUB_ENV"
          printf '%s\n' "$VER" > kit/_system/version.txt
      - name: Build installer
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q nsis
          mkdir -p release
          makensis -V2 -DVERSION="$VER" setup.nsi
      - name: Build zip
        run: |
          mkdir -p zipsrc && cp -r kit "zipsrc/AD FINEM Stream Kit"
          chmod +x "zipsrc/AD FINEM Stream Kit"/*.sh "zipsrc/AD FINEM Stream Kit"/*.command "zipsrc/AD FINEM Stream Kit"/_system/*.py
          (cd zipsrc && zip -qr "../release/AD-FINEM-Stream-Kit-$VER.zip" "AD FINEM Stream Kit")
          (cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            NOTES="kit/CHANGES/$TAG.md"; [ -f "$NOTES" ] || NOTES=/dev/null
            gh release create "$TAG" release/* --target "$GITHUB_SHA" --title "AD FINEM Stream Kit $VER" --notes-file "$NOTES"
          fi
